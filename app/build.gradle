plugins {
    id 'com.android.application'
}

android {
    namespace 'com.chet.pixelopahome'
    compileSdk 36

    defaultConfig {
        applicationId 'com.chet.pixelopahome'
        minSdk 35
        targetSdk 36
        versionCode 7
        versionName '1.1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
